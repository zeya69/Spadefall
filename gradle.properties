group=com.supercraftmc
version=0.1.0

# --------------------------------------------------------------------------
# Paper API coordinate.
#
# Mojang moved to year-based versions (26.1, 26.2...), so Paper's artifact
# version follows the game version. If the very first CI build fails with
# "Could not find io.papermc.paper:paper-api", this ONE line is almost
# certainly the cause - check the exact version at
# https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/
# and correct it here. Nothing else needs to change.
# --------------------------------------------------------------------------
paperApiVersion=26.2.build.+

# Java version required by Minecraft 26.1+
javaVersion=25

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
