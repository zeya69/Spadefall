# Lobby world players return to. Leave blank to use the server's main world.
lobby-world: ""

game:
  min-players: 4
  max-players: 16          # always capped by the map's own spawn-marker count
  max-concurrent-arenas: 2

  # Start the countdown at min-players (true), or wait until full / an admin
  # runs /sf start (false). Each arena can override: /sf arena set <a> autostart
  auto-start: true
  countdown-seconds: 30
  countdown-seconds-when-full: 10

  maps-per-round: 3
  descent-time-limit: 180
  intermission-duration: 30
  deathmatch-time-limit: 180

  # Seconds players are held at their start before "GO".
  start-freeze-seconds: 3
  # Pause between maps while placements show.
  breather-seconds: 5
  # How long the final standings stay up.
  results-seconds: 10

  # ON | OFF | CAPPED.
  #   ON     - vanilla fall damage. A long drop kills; you respawn at your start.
  #            This is what makes the ledges matter. Default.
  #   CAPPED - hurts up to fall-damage-cap (half-hearts) but never kills. Casual.
  #   OFF    - no fall damage at all. The straight dive always wins; not recommended.
  fall-damage: ON
  fall-damage-cap: 6.0
  # Scales fall damage in ON mode. 1.0 is vanilla (lethal from ~23 blocks).
  # 1.5 makes ~16 blocks lethal, 2.0 about 13. Turn this up until the ledges
  # feel like they matter on your map.
  fall-damage-multiplier: 1.0
  # You finish once you've been on the ground at or below the line, alive,
  # with no damage taken for a second, for this many CONTINUOUS seconds.
  # Sampled four times a second. A fatal landing can never count.
  finish-settle-seconds: 2
  # Deathmatch after the last descent. Off by default - the descent is the
  # game. Per-arena: /sf arena set <arena> deathmatch true
  deathmatch: false
  # Seconds frozen at your start after falling out of the region.
  void-penalty-seconds: 3
  # How close you must be to a chip to collect it.
  pickup-radius: 1.2

# Score is its own axis - never spendable, decides the round.
scoring:
  # Points for finishing a map 1st, 2nd, 3rd... Beyond the list: a small floor.
  placement: [500, 300, 200, 150, 100, 75, 50, 25]
  # Points for not finishing before the timer.
  timeout: 10
  # Flat points per chip picked up, whatever its denomination. Kept small on
  # purpose: a patient collector should get richer, not win the round.
  points-per-chip: 10

chips:
  per-player: 4
  # Chip bonus for finishing a map 1st, 2nd, 3rd... Speed gets paid too.
  placement-purse: [100, 50, 25]

spades:
  # Count scales with lobby size instead of being a fixed number.
  #   64 players * 0.25 = 16 spades
  per-player: 0.25
  min: 2
  max: 24

perks:
  slots: 2

maps:
  # Hard rejection threshold. A community map larger than this is refused.
  max-size-x: 256
  max-size-y: 384
  max-size-z: 256
  # Blocks below the finish before a player is considered fallen out.
  void-margin: 20
  # Blocks scanned per tick when reading markers out of a region.
  scan-blocks-per-tick: 40000
  # Blocks placed per tick when pasting a schematic. 8000 lands the demo
  # crater in about two seconds; lower it on a struggling server.
  paste-blocks-per-tick: 8000

storage:
  # sqlite | mysql
  type: sqlite
  # sqlite only
  file: data.db
  # mysql only
  mysql:
    host: localhost
    port: 3306
    database: spadefall
    username: spadefall
    password: ""
    useSSL: false
    pool-size: 6
  history-retention-days: 30

setup:
  # Show markers glowing in the world as soon as you enter edit mode.
  glow-on-enter: true
  # Tell ops on join when no arenas exist yet.
  join-hint: true
  region:
    # In auto mode the region is the bounding box of every marker, padded by
    # this much. Visible in glow mode as the white edges.
    auto-padding-horizontal: 8
    auto-padding-vertical: 16

# Warn (never block) when configured limits look unreasonable for the heap.
startup-sanity-check: true

debug: false
