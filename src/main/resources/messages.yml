# All player-facing text. Colour codes use & and hex &#RRGGBB.
prefix: "&8[&a&l♠&8] &r"

general:
  no-permission: "&cYou don't have permission to do that."
  player-only: "&cThat command can only be run by a player."
  unknown-command: "&cUnknown subcommand. Try &f/sf help&c."
  reloaded: "&aConfiguration reloaded."
  invalid-number: "&c'&f%input%&c' is not a number."

arena:
  not-found: "&cNo arena named &f%arena%&c."
  created: "&aArena &f%arena% &acreated."
  deleted: "&aArena &f%arena% &adeleted."
